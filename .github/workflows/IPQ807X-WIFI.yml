name: IPQ807X-WIFI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -af
      - name: Add Swap
        run: |
          set -e
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Git config & retry wrapper
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
      - name: Init Environment
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y build-essential clang g++ gcc-multilib gettext swig zlib1g-dev file python3-distutils libssl-dev rsync wget curl
      - name: Load Custom Config
        run: |
          if [ -f .github/configs/ipq807x.config ]; then
            cp .github/configs/ipq807x.config .config
          fi
      - name: Apply patches
        run: |
          set +e
          if [ -d patches ]; then
            git am -3 patches/*.patch || git apply --3way patches/*.patch
          fi
          set -e
      - name: Download feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Make download
        run: |
          make -j$(nproc) download
      - name: Make compile
        run: |
          make -j$(nproc)
      - name: Organize Files
        run: |
          mkdir -p output_firmware
          find bin/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.ipk" \) -exec cp {} output_firmware/ \;
      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: firmware-output
          path: output_firmware
